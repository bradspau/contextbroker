services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    restart: unless-stopped

  fuseki:
    image: secoresearch/fuseki:6.1.0
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
    command: ["java", "-cp", "*:/javalibs/*", "org.apache.jena.fuseki.main.cmds.FusekiServerCmd", "--update", "--mem", "/network-dataset"]
    restart: unless-stopped

  lodlive-proxy:
    build: ./lodlive-proxy
    container_name: lodlive-proxy
    ports:
      - "8081:8081"
    environment:
      - FUSEKI_QUERY_ENDPOINT=http://fuseki:3030/network-dataset/query
    depends_on:
      - fuseki
    restart: unless-stopped

  lodlive:
    build:
      context: https://github.com/LodLive/LodLive.git#327fcbbc4e03400ea5bdc5661fbb022c40bae28a
    container_name: lodlive
    ports:
      - "8888:80"
    volumes:
      - ./lodlive/lodlive.profile.js:/usr/share/nginx/html/js/lodlive.profile.js:ro
    depends_on:
      - lodlive-proxy
    restart: unless-stopped

  contextbroker-api:
    build: .
    container_name: contextbroker-api
    ports:
      - "8080:8080"
    environment:
      - FUSEKI_QUERY_ENDPOINT=http://fuseki:3030/network-dataset/query
      - VM_QUERY_ENDPOINT=http://victoriametrics:8428/api/v1/query
      - TMF921_BASE_URL=http://tmf921-server:8000/tmf-api/intentManagement/v5
    depends_on:
      - fuseki
      - victoriametrics
    restart: unless-stopped

  # TMF921 intent server (BBF_921_java). Opt-in: docker compose --profile tmf921 up -d --build tmf921-server
  # Run scripts/tmf921_preflight.sh first. The licensed TIO ontology is never baked into the image;
  # it is bind-mounted read-only (SchemaInit loads it on every start). 3030/8001 are not published.
  tmf921-server:
    build:
      context: ./docker/tmf921
      additional_contexts:
        bbf: ${TMF921_SRC:-../BBF_921_java}
    image: contextbroker/tmf921-server:local
    container_name: tmf921-server
    profiles: ["tmf921"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=standalone
      - INTENT_EVALUATOR=${INTENT_EVALUATOR:-java}
      - INTENT_FUSEKI_LOOPBACK=false
    volumes:
      - tdb2-tmf921:/app/tdb2-data
      - ${TIO_ONTOLOGY_DIR:-../BBF_921_java/ontology}:/app/ontology:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  vm-data:
  tdb2-tmf921:
