services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0@sha256:b51f6910c985bb146a151a44f0c877e7864b8db452c88c732d1591cbd18a5f12
    container_name: victoriametrics
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    # One value feeds this flag and the API's as_of limit (BROKER_RETENTION_PERIOD below).
    # A unit (h or d) is required: a bare number means months to VictoriaMetrics.
    command: ["-retentionPeriod=${BROKER_RETENTION_PERIOD:-30d}"]
    restart: unless-stopped

  fuseki:
    image: secoresearch/fuseki:6.1.0@sha256:684f47c04deb2d60886fb112d048b4a526992e251771a548eb6ce9e5a7d09055
    container_name: fuseki
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD in .env (letters and digits only)}
      - READER_PASSWORD=${FUSEKI_READER_PASSWORD:?set FUSEKI_READER_PASSWORD in .env (letters and digits only, not the admin one)}
    # Authenticated launch, verified on the real image (design/fuseki-auth.md): the wrapper writes
    # a private password file with two users from the container's own variables (admin, and reader
    # for queries only), then starts Fuseki with --passwd and --auth=basic so every endpoint demands
    # a credential. docker/fuseki/config.ttl names the endpoints and who may use each: query for both
    # users, update and the graph store for admin only (bead contextbroker-oiq). The config's database
    # directory is the one --loc named before, so the stored graph is unchanged.
    # $$ keeps compose from interpolating the variable meant for the container shell.
    command:
      - sh
      - -c
      - >-
        umask 077;
        [ "$$ADMIN_PASSWORD" != "$$READER_PASSWORD" ] || { echo "FUSEKI_READER_PASSWORD must differ from FUSEKI_ADMIN_PASSWORD" >&2; exit 1; };
        printf 'admin: %s\nreader: %s\n' "$$ADMIN_PASSWORD" "$$READER_PASSWORD" > /tmp/fuseki-passwd;
        exec java -cp '*:/javalibs/*' org.apache.jena.fuseki.main.cmds.FusekiServerCmd
        --conf=/etc/fuseki/config.ttl
        --passwd=/tmp/fuseki-passwd --auth=basic
    volumes:
      - fuseki-data:/fuseki-base/databases
      - ./docker/fuseki/config.ttl:/etc/fuseki/config.ttl:ro
    restart: unless-stopped

  lodlive-proxy:
    build: ./lodlive-proxy
    container_name: lodlive-proxy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - FUSEKI_QUERY_ENDPOINT=http://fuseki:3030/network-dataset/query
      - FUSEKI_READER_PASSWORD=${FUSEKI_READER_PASSWORD:?set FUSEKI_READER_PASSWORD in .env}
      - LODLIVE_ALLOWED_ORIGINS=${LODLIVE_ALLOWED_ORIGINS:-http://localhost:8888,http://127.0.0.1:8888}
    depends_on:
      - fuseki
    restart: unless-stopped

  lodlive:
    build:
      context: https://github.com/LodLive/LodLive.git#327fcbbc4e03400ea5bdc5661fbb022c40bae28a
    container_name: lodlive
    ports:
      - "8888:80"
    volumes:
      - ./lodlive/lodlive.profile.js:/usr/share/nginx/html/js/lodlive.profile.js:ro
    depends_on:
      - lodlive-proxy
    restart: unless-stopped

  # The knowledge store (D-35): the retrieval index over the reviewed files in knowledge/. It holds
  # only data rebuilt from those files, so losing qdrant-data loses nothing. Published on loopback,
  # HTTP port only (the gRPC port is not used and not published). The key is required, with no default.
  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged@sha256:efb96a9425a90d2d5a1a0a474156280df1892dcdf1af3e8515bd2589b1bfd88b
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?set QDRANT_API_KEY in .env (letters and digits only)}
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  contextbroker-api:
    build: .
    container_name: contextbroker-api
    ports:
      - "8080:8080"
    environment:
      - FUSEKI_QUERY_ENDPOINT=http://fuseki:3030/network-dataset/query
      - FUSEKI_DATA_ENDPOINT=http://fuseki:3030/network-dataset/data
      - VM_QUERY_ENDPOINT=http://victoriametrics:8428/api/v1/query
      - TMF921_BASE_URL=http://tmf921-server:8000/tmf-api/intentManagement/v5
      - FUSEKI_READER_PASSWORD=${FUSEKI_READER_PASSWORD:?set FUSEKI_READER_PASSWORD in .env}
      - BROKER_JWT_PUBLIC_KEY_FILE=/run/secrets/broker_jwt_public.pem
      - BROKER_JWT_ISSUER=${BROKER_JWT_ISSUER:-}
      - BROKER_JWT_AUDIENCE=${BROKER_JWT_AUDIENCE:-context-broker}
      - BROKER_RETENTION_PERIOD=${BROKER_RETENTION_PERIOD:-30d}
      - BROKER_STATE_PATH=/data/broker-state.sqlite3
      - BROKER_OUTCOME_CAP=${BROKER_OUTCOME_CAP:-1024}
      - BROKER_MARK_CAP=${BROKER_MARK_CAP:-1024}
      - BROKER_SITUATION_CAP=${BROKER_SITUATION_CAP:-100000}
      - BROKER_SITUATION_RETENTION=${BROKER_SITUATION_RETENTION:-7d}
      - BROKER_EVENT_CAP=${BROKER_EVENT_CAP:-100000}
      - BROKER_EVENT_RETENTION=${BROKER_EVENT_RETENTION:-7d}
      - BROKER_EVENT_WINDOW_DEFAULT=${BROKER_EVENT_WINDOW_DEFAULT:-15m}
      - BROKER_EVENT_WINDOW_MAX=${BROKER_EVENT_WINDOW_MAX:-24h}
      - BROKER_PROMOTED_CAP=${BROKER_PROMOTED_CAP:-10000}
      - BROKER_PROMOTED_RETENTION=${BROKER_PROMOTED_RETENTION:-30d}
      - BROKER_PROMOTE_MIN_EVENTS=${BROKER_PROMOTE_MIN_EVENTS:-3}
      - BROKER_PROMOTE_WINDOW=${BROKER_PROMOTE_WINDOW:-15m}
      - BROKER_TELEMETRY_WORKERS=${BROKER_TELEMETRY_WORKERS:-8}
      - BROKER_TSDB_SERIES_LIMIT=${BROKER_TSDB_SERIES_LIMIT:-500}
      - BROKER_QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?set QDRANT_API_KEY in .env (letters and digits only)}
      - BROKER_KNOWLEDGE_PATH=/knowledge
    # The API verifies bearer tokens with a public key only. An unset HOST_BROKER_JWT_PUBLIC_KEY
    # mounts an empty file: the API starts and refuses every /context/* call (no key configured).
    volumes:
      - ${HOST_BROKER_JWT_PUBLIC_KEY:-/dev/null}:/run/secrets/broker_jwt_public.pem:ro
      # Holds the broker's durable state (outcomes, high-water marks, situation records, the event
      # store, decision records). Never remove it: never run `docker compose down -v`.
      - broker-state:/data
      # The reviewed knowledge files, read-only: git is the source of truth (D-38).
      - ./knowledge:/knowledge:ro
    # /health answers 503 when Fuseki, VictoriaMetrics, the TMF921 server or Qdrant does not answer, and
    # urlopen raises on 503, so a degraded broker reports unhealthy. The image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # qdrant is listed for start order only, with no health condition: a Qdrant outage
    # must not stop the API (/health reports it and the other context classes keep answering).
    depends_on:
      - fuseki
      - victoriametrics
      - qdrant
    restart: unless-stopped

  # TMF921 intent server (BBF_921_java). Opt-in: docker compose --profile tmf921 up -d --build tmf921-server
  # Run scripts/tmf921_preflight.sh first. The licensed TIO ontology is never baked into the image;
  # it is bind-mounted read-only (SchemaInit loads it on every start). 3030/8001 are not published.
  tmf921-server:
    build:
      context: ./docker/tmf921
      additional_contexts:
        bbf: ${TMF921_SRC:-../BBF_921_java}
    image: contextbroker/tmf921-server:local
    container_name: tmf921-server
    profiles: ["tmf921"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=standalone
      - INTENT_EVALUATOR=${INTENT_EVALUATOR:-java}
      - INTENT_FUSEKI_LOOPBACK=false
    volumes:
      - tdb2-tmf921:/app/tdb2-data
      - ${TIO_ONTOLOGY_DIR:-../BBF_921_java/ontology}:/app/ontology:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  vm-data:
  fuseki-data:
  tdb2-tmf921:
  broker-state:
  qdrant-data:
